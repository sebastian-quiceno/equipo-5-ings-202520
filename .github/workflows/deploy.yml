name: CI/CD Render Deploy

on:
  push:
    branches:
      - pruebaRender

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Opcional: verificar que el backend compila correctamente
      - name: Build with Maven
        working-directory: BackEnd
        run: chmod +x mvnw && ./mvnw -B -DskipTests package

      # Disparar el despliegue en Render directamente
      - name: Trigger Deploy on Render
        run: |
          echo "Desplegando en Render..."
          curl "https://api.render.com/deploy/srv-d4af243ipnbc739jmlc0?key=z8G2SlY81kI"



